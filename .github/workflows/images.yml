name: Optimize images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/process_images.py'
      - 'src/data/network.json'
      - '.github/workflows/images.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: image-mankeli-main
  cancel-in-progress: false

jobs:
  images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Test image processor
        run: python -m unittest discover -s tests -p 'test_images.py'
      - name: Download and optimize
        run: python scripts/process_images.py --download --update-data
      - name: Save images and update paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/network.json public/images
          if git diff --cached --quiet; then
            echo "No new images to commit"
            exit 0
          fi
          git commit -m "assets: cache and optimize network images"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed optimized images"
              # Pushes using GITHUB_TOKEN do not automatically trigger another workflow.
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            echo "Remote moved; rebasing before retry $attempt"
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push optimized images after retries" >&2
          exit 1
