name: Optimize images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/process_images.py'
      - 'src/data/network.json'
      - '.github/workflows/images.yml'

permissions:
  contents: write

concurrency:
  group: image-mankeli-main
  cancel-in-progress: false

jobs:
  images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Test image processor
        run: python -m unittest discover -s tests -p 'test_images.py'
      - name: Download and optimize
        run: python scripts/process_images.py --download --update-data
      - name: Save images and update paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/network.json public/images
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache and optimize network images"
            git push
          else
            echo "No new images to commit"
          fi
